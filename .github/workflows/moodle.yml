name: Moodle compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phpunit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {moodle: MOODLE_405_STABLE, php: '8.1'}
          - {moodle: MOODLE_500_STABLE, php: '8.2'}
          - {moodle: MOODLE_501_STABLE, php: '8.2'}
          - {moodle: MOODLE_502_STABLE, php: '8.3'}
          - {moodle: MOODLE_503_STABLE, php: '8.3'}
          - {moodle: MOODLE_503_STABLE, php: '8.4'}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, pdo_pgsql, intl, soap, sodium, gd, mbstring, zip
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install test tooling
        run: |
          composer create-project --no-interaction --no-dev moodlehq/moodle-plugin-ci ci ^4
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          DB_USER: postgres
          DB_PASS: ''
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: PHP syntax
        run: moodle-plugin-ci phplint
      - name: Plugin validation
        run: moodle-plugin-ci validate
      - name: PHPUnit
        run: moodle-plugin-ci phpunit
